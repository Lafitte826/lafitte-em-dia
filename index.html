<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f5f8b">
<title>Lafitte em Dia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  :root{
    --z:1;
    --bg:#f3f5f8; --card:#ffffff; --text:#17202b; --muted:#566274;
    --line:#d9dee6; --accent:#1f5f8b; --accent-soft:#e3eef6;
    --ok:#1d7a46; --ok-soft:#e3f3e9; --warn:#b4491f; --warn-soft:#fdeee6;
    --amb:#7a4300; --amb-soft:#fff1dc; --zap:#1f8f4e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --card:#1b212a; --text:#eef1f5; --muted:#a3adbb;
      --line:#2d3641; --accent:#78b9e6; --accent-soft:#1d2e3b;
      --ok:#5fc78a; --ok-soft:#183024; --warn:#f0916a; --warn-soft:#3a2418;
      --amb:#f2c27a; --amb-soft:#3a2c14; --zap:#2fae65;
    }
  }
  *{box-sizing:border-box}
  html{font-size:calc(18px * var(--z))}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.45}
  .top{position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:8px 14px; padding-top:max(8px, env(safe-area-inset-top))}
  .top a.voltar{color:var(--accent); text-decoration:none; font-weight:700; padding:6px 10px;
    border:2px solid var(--accent); border-radius:10px; font-size:.9rem; white-space:nowrap}
  .top a.voltar.oculto{display:none}
  .top .nome{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.1}
  .top .nome small{font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:3px}
  .top .nome img{height:1.7rem; width:auto; max-width:100%; display:block}
  @media (prefers-color-scheme: dark){ .top .nome img{filter:invert(1)} }
  .zoom{white-space:nowrap}
  .zoom button{font:inherit; font-size:.85rem; font-weight:700; color:var(--accent); background:transparent;
    border:2px solid var(--accent); border-radius:10px; padding:4px 9px; margin-left:4px}
  main{max-width:720px; margin:0 auto; padding:14px 14px 60px}
  h1{font-size:1.4rem; margin:4px 0 2px}
  h2{font-size:1.1rem; margin:22px 0 8px}
  .sub{color:var(--muted); font-size:.9rem; margin:0 0 12px}
  .card{display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:10px; color:var(--text); text-decoration:none}
  a.card{display:flex; gap:12px; align-items:center}
  .card .ic{font-size:1.8rem; line-height:1}
  .card .tx{flex:1; min-width:0}
  .card b{display:block; font-size:1.05rem}
  .card .q{color:var(--muted); font-size:.88rem}
  .card .seta{font-size:1.4rem; color:var(--muted)}
  .card.pend{background:var(--warn-soft); border:2px solid var(--warn)}
  .card.pend .q{color:var(--warn); font-weight:700}
  .card.perto{background:var(--amb-soft); border-color:transparent}
  .card.perto .q{color:var(--amb); font-weight:700}
  .card.feita .q{color:var(--ok)}
  .tudo-ok{background:var(--ok-soft); color:var(--ok); border-radius:14px; padding:12px 14px; font-weight:700; margin-bottom:10px}
  .item{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px}
  .item.lido{border-color:var(--ok)}
  .item .lin{display:flex; align-items:center; gap:10px}
  .item label{flex:1; font-weight:700}
  .item label small{display:block; font-weight:400; color:var(--muted); font-size:.8rem}
  .item input{width:9.5em; font:inherit; font-size:1.15rem; padding:8px 10px; border:2px solid var(--line);
    border-radius:10px; background:var(--bg); color:var(--text); text-align:right}
  .item input:focus{outline:none; border-color:var(--accent)}
  .item .res{font-size:.85rem; color:var(--muted); margin-top:4px}
  .item .res.alerta{color:var(--warn); font-weight:700}
  .item .dica{font-size:.85rem; color:var(--accent); margin-top:4px}
  .opc{display:flex; gap:8px; margin-top:8px}
  .opc button{flex:1; font:inherit; font-size:.95rem; font-weight:700; padding:10px; border-radius:10px;
    border:2px solid var(--line); background:var(--bg); color:var(--text)}
  .opc button.sel-ok{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
  .opc button.sel-prob{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
  textarea, .campo input{width:100%; font:inherit; padding:10px; border:2px solid var(--line); border-radius:10px;
    background:var(--bg); color:var(--text); margin-top:8px}
  textarea{min-height:4.5em; resize:vertical}
  .campo{margin-bottom:12px}
  .campo label{font-weight:700}
  .fotos{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
  .fotos div{position:relative}
  .fotos img{width:88px; height:88px; object-fit:cover; border-radius:10px; display:block}
  .fotos button{position:absolute; top:-6px; right:-6px; width:28px; height:28px; border-radius:50%;
    border:none; background:var(--warn); color:#fff; font-weight:700; font-size:1rem; line-height:1}
  .btn{display:block; width:100%; font:inherit; font-size:1.1rem; font-weight:700; text-align:center; text-decoration:none;
    padding:14px; border-radius:12px; border:2px solid var(--accent); background:var(--accent); color:#fff; margin:10px 0}
  @media (prefers-color-scheme: dark){ .btn{color:#0d1a24} }
  .btn.sec{background:transparent; color:var(--accent)}
  .btn.zap{background:var(--zap); border-color:var(--zap); color:#fff}
  .btn.ok{background:var(--ok); border-color:var(--ok); color:#fff}
  .btn[disabled]{opacity:.45}
  label.btn input{display:none}
  .prog{position:sticky; top:3.3rem; z-index:5; background:var(--bg); padding:6px 0; font-size:.9rem; color:var(--muted); font-weight:700}
  pre.msg{white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px;
    font:inherit; font-size:.9rem; max-height:45vh; overflow:auto}
  .passo{font-weight:700; margin-top:16px}
  .nota{font-size:.88rem; color:var(--muted)}
  .rodape{margin-top:30px; font-size:.8rem; color:var(--muted); text-align:center}
  .rodape a{color:var(--accent)}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ok); color:#fff;
    padding:12px 18px; border-radius:12px; font-weight:700; z-index:20; max-width:90vw; text-align:center}
  .andar{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:12px}
  .andar-cab{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .andar-cab .num{flex:1; font-size:1.35rem; font-weight:800; white-space:nowrap}
  .luz{font:inherit; font-size:.8rem; font-weight:700; border:2px solid var(--line); background:var(--bg); color:var(--text);
    border-radius:10px; padding:4px 8px; line-height:1.15; text-align:center}
  .luz small{display:block; font-size:.7rem; color:var(--muted)}
  .luz.l-ok{border-color:var(--ok); background:var(--ok-soft)} .luz.l-ok small{color:var(--ok)}
  .luz.l-res{border-color:var(--accent); background:var(--accent-soft)} .luz.l-res small{color:var(--accent)}
  .luz.l-man{border-color:var(--warn); background:var(--warn-soft)} .luz.l-man small{color:var(--warn)}
  .luz-painel{background:var(--bg); border-radius:10px; padding:10px; margin-top:8px}
  .opc.vert{flex-direction:column}
  .opc button.sel-ok{border-color:var(--ok); background:var(--ok-soft); color:var(--ok)}
  .opc button.sel-resolvido{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .opc button.sel-manut{border-color:var(--warn); background:var(--warn-soft); color:var(--warn)}
  .aptos{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
  .apto{background:var(--bg); border-radius:10px; padding:8px}
  .apto > b{display:block; font-size:1.05rem; margin-bottom:2px}
  .med{margin-top:6px}
  .med label{font-weight:700; font-size:.9rem}
  .med input.grande{width:100%; font:inherit; font-size:1.6rem; font-weight:700; letter-spacing:.04em; padding:6px 8px;
    border:2px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); text-align:right; font-variant-numeric:tabular-nums}
  .med input.grande:focus{outline:none; border-color:var(--accent)}
  .med.lido input.grande{border-color:var(--ok)}
  .med .res{font-size:.75rem; color:var(--muted); margin-top:2px; line-height:1.25}
  .med .res.alerta{color:var(--warn); font-weight:700}
  .apto .dica{font-size:.85rem; color:var(--accent); margin-top:6px}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:flex; align-items:center; justify-content:center; padding:16px}
  .modal .caixa{background:var(--card); border-radius:16px; padding:18px; max-width:420px; width:100%; font-size:1.05rem}
  .modal .caixa > b{font-size:1.25rem; color:var(--warn)}
  .modal .num{font-size:1.5rem}
  .modal .alerta{color:var(--warn); font-weight:700; font-size:.95rem}
  .escada{width:1.05em; height:1.05em; vertical-align:-.15em; color:var(--warn)}
  h2.grupo{margin:16px 0 6px; font-size:1rem; color:var(--muted)}
  .campo input.grande{font-size:1.5rem; font-weight:700; text-align:right}
  .pessoas{display:grid; gap:14px; margin-top:16px}
  .pessoa{display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:16px; align-items:center;
    background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px 20px; text-decoration:none; color:var(--text)}
  .pessoa .ic{grid-row:1/3; font-size:2.6rem; line-height:1}
  .pessoa b{font-size:1.5rem}
  .pessoa .q{color:var(--ok); font-weight:700}
  .pessoa.pend{border-color:var(--warn); background:var(--warn-soft)}
  .pessoa.pend .q{color:var(--warn)}
  .plantas{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; margin:8px 0}
  .plantas figure{margin:0}
  .plantas img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; display:block}
  .plantas figcaption{font-size:.8rem; color:var(--muted); line-height:1.25; margin-top:4px}
  .plantas figcaption b{display:block; color:var(--accent); font-size:.9rem}
  .opc button.sel-res{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
  .lista-check{display:grid; gap:8px}
  .check{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; font-size:1.05rem; font-weight:700;
    padding:14px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--text)}
  .check .box{flex:none; width:1.6em; height:1.6em; border-radius:8px; border:2px solid var(--muted); display:grid; place-items:center; color:#fff}
  .check.feito{border-color:var(--ok); background:var(--ok-soft)}
  .check.feito .box{background:var(--ok); border-color:var(--ok)}
  .teste{display:flex; flex-wrap:wrap; align-items:center; gap:8px; justify-content:center; background:var(--accent-soft);
    padding:8px 14px; font-size:.85rem; font-weight:700; color:var(--accent)}
  .teste input, .teste button{font:inherit; padding:4px 8px; border-radius:8px; border:2px solid var(--accent); background:var(--card); color:var(--text)}
  .check .hora, .apoio .hora{flex:none; width:3.6em; font-size:1.15rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1}
  .check .hora small{display:block; font-size:.7rem; font-weight:600; color:var(--muted)}
  .check .tx{flex:1}
  .check .box{width:2em; height:2em; font-size:1.1rem}
  .check.agora{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .check.agora .hora::after{content:"AGORA"; display:block; font-size:.6rem; color:var(--accent); letter-spacing:.08em}
  .apoio{display:flex; align-items:center; gap:12px; padding:6px 14px; color:var(--muted); font-weight:700}
  .apoio .hora{font-size:.95rem}
</style>
</head>
<body>
<header class="top">
  <a class="voltar oculto" href="#/">← Início</a>
  <span class="nome"><small>Lafitte em Dia</small><img src="logo-maison-lafitte.svg" alt="Maison Lafitte"></span>
  <span class="zoom"><button type="button" data-z="-1" aria-label="Diminuir letra">A−</button><button type="button" data-z="1" aria-label="Aumentar letra">A+</button></span>
</header>
<main id="app"></main>
<script src="dados.js"></script>
<script src="agenda.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
